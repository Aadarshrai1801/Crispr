services:
  crisp:
    build: .
    image: crispai:${CRISPR_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      # Blocker #5: production refuses to boot without these being set properly.
      CRISPR_ENCRYPTION_SECRET: ${CRISPR_ENCRYPTION_SECRET:?set CRISPR_ENCRYPTION_SECRET in your environment}
      DATA_DIR: /app/data
    volumes:
      # All persistent state: SQLite, LanceDB vectors, uploads, model cache.
      - crisp-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  crisp-data:
